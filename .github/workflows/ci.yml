name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the production image on every PR (catches Dockerfile breakage) and publishes it from main.
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # tags and GitHub releases (semantic-release)
      packages: write
    # One run at a time per branch: two merges never compute the same version.
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/dpontejs/portfolio
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags: semantic-release and git describe
      - run: make image IMAGE=$IMAGE:sha-$GITHUB_SHA GIT_SHA=$GITHUB_SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # project stats from the GitHub API
      - run: scripts/smoke-image.sh $IMAGE:sha-$GITHUB_SHA $GITHUB_SHA
      # Versions (docs/features/deploys.md in the infra repo): feat → minor, fix → patch, breaking →
      # minor while 0.x. The dry run only computes the next version (.next-version); the release itself
      # happens after the push, so a broken image never gets one.
      - if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Next version (semantic-release dry run)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@26.0.1 -p @semantic-release/exec@7.1.0 -p conventional-changelog-conventionalcommits@10.4.1 semantic-release --dry-run
      # 0.2.0 on a release commit; 0.2.0+2 two commits after it (no feat/fix in between).
      - name: Version labels
        run: |
          if [ -f .next-version ]; then VERSION=$(cat .next-version)
          else VERSION=$(git describe --tags --match 'v*' 2>/dev/null | sed -E 's/^v//; s/-([0-9]+)-g[0-9a-f]+$/+\1/'); fi
          VERSION=${VERSION:-0.0.0+${GITHUB_SHA::7}}
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FROM $IMAGE:sha-$GITHUB_SHA" | docker build -q -t $IMAGE:sha-$GITHUB_SHA \
            --label org.opencontainers.image.version=$VERSION \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --label org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ) -
          echo "version $VERSION"
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :sha-<commit> is immutable (rollback target); :main moves and is what the VPS follows.
      - if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:sha-$GITHUB_SHA $IMAGE:main
          docker push $IMAGE:sha-$GITHUB_SHA
          docker push $IMAGE:main
          if [ -f .next-version ]; then
            docker tag $IMAGE:sha-$GITHUB_SHA $IMAGE:$VERSION
            docker push $IMAGE:$VERSION
          fi
      - name: Release (tag + GitHub release with the commits)
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes -p semantic-release@26.0.1 -p @semantic-release/exec@7.1.0 -p conventional-changelog-conventionalcommits@10.4.1 semantic-release

  # The VPS pulls :main every minute (infra repo, docs/features/auto-deploy.md). This job only
  # watches the public site until it serves this commit; red = not deployed or rolled back.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer merge supersedes an older one: its commit would never go live, so cancel the old wait.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://diegoponte.dev
    steps:
      - uses: actions/checkout@v7
      - run: scripts/wait-for-deploy.sh https://diegoponte.dev $GITHUB_SHA 300
