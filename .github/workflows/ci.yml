name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: make install
      - run: make lint
      - run: make test
      - run: npx playwright install --with-deps chromium
      - run: make test-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the production image on every PR (catches Dockerfile breakage) and publishes it from main.
  image:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/dpontejs/portfolio
    steps:
      - uses: actions/checkout@v7
      - run: make image IMAGE=$IMAGE:sha-$GITHUB_SHA GIT_SHA=$GITHUB_SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # project stats from the GitHub API
      - run: scripts/smoke-image.sh $IMAGE:sha-$GITHUB_SHA $GITHUB_SHA
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # :sha-<commit> is immutable (rollback target); :main moves and is what the VPS follows.
      - if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE:sha-$GITHUB_SHA $IMAGE:main
          docker push $IMAGE:sha-$GITHUB_SHA
          docker push $IMAGE:main

  # The VPS pulls :main every minute (infra repo, docs/features/auto-deploy.md). This job only
  # watches the public site until it serves this commit; red = not deployed or rolled back.
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A newer merge supersedes an older one: its commit would never go live, so cancel the old wait.
    concurrency:
      group: deploy-production
      cancel-in-progress: true
    environment:
      name: production
      url: https://diegoponte.dev
    steps:
      - uses: actions/checkout@v7
      - run: scripts/wait-for-deploy.sh https://diegoponte.dev $GITHUB_SHA 300
